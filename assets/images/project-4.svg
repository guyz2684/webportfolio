<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="p4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p4Bg)" />

  <!-- Ambient Light -->
  <circle cx="300" cy="200" r="140" fill="#0284c7" opacity="0.25" filter="url(#p4Glow)" />
  <circle cx="450" cy="280" r="90" fill="#f59e0b" opacity="0.25" filter="url(#p4Glow)" />

  <!-- Orbit Rings -->
  <g fill="none" stroke-width="2" opacity="0.6">
    <ellipse cx="300" cy="200" rx="220" ry="80" stroke="url(#neonG1)" transform="rotate(-20 300 200)" />
    <ellipse cx="300" cy="200" rx="200" ry="70" stroke="url(#neonG2)" transform="rotate(35 300 200)" stroke-dasharray="12 8" />
  </g>

  <!-- 3D Isometric Cube / Polyhedron in Center -->
  <g transform="translate(300, 200)">
    <!-- Top Face -->
    <polygon points="0,-75 65,-38 0,0 -65,-38" fill="#38bdf8" opacity="0.9" />
    <!-- Left Face -->
    <polygon points="-65,-38 0,0 0,75 -65,38" fill="#0284c7" />
    <!-- Right Face -->
    <polygon points="0,0 65,-38 65,38 0,75" fill="#f59e0b" />

    <!-- Neon Wireframe Lines -->
    <line x1="0" y1="-75" x2="65" y2="-38" stroke="#fef08a" stroke-width="2.5" />
    <line x1="65" y1="-38" x2="0" y2="0" stroke="#fef08a" stroke-width="2.5" />
    <line x1="0" y1="0" x2="-65" y2="-38" stroke="#fef08a" stroke-width="2.5" />
    <line x1="-65" y1="-38" x2="0" y2="-75" stroke="#fef08a" stroke-width="2.5" />
    <line x1="0" y1="0" x2="0" y2="75" stroke="#ffffff" stroke-width="2.5" />
    <line x1="-65" y1="38" x2="0" y2="75" stroke="#ffffff" stroke-width="2.5" />
    <line x1="65" y1="38" x2="0" y2="75" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Floating Particles & Motion Trails -->
  <circle cx="150" cy="110" r="16" fill="url(#neonG2)" filter="url(#p4Glow)" />
  <circle cx="440" cy="110" r="12" fill="url(#neonG1)" filter="url(#p4Glow)" />
  <circle cx="420" cy="300" r="18" fill="url(#neonG1)" />
  <circle cx="160" cy="290" r="14" fill="url(#neonG2)" />
  
  <line x1="150" y1="110" x2="200" y2="140" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="440" y1="110" x2="390" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Typography Kinetic text -->
  <text x="300" y="340" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="4">MOTION &amp; 3D DYNAMICS</text>
  <text x="300" y="365" font-family="sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle" letter-spacing="2">AFTER EFFECTS • BLENDER • CINEMA 4D</text>
</svg>
