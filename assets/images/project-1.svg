<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p1Blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="p1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="p1Glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p1Bg)" />

  <!-- Background Grid -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.08">
    <path d="M0,50 H600 M0,100 H600 M0,150 H600 M0,200 H600 M0,250 H600 M0,300 H600 M0,350 H600" />
    <path d="M50,0 V400 M100,0 V400 M150,0 V400 M200,0 V400 M250,0 V400 M300,0 V400 M350,0 V400 M400,0 V400 M450,0 V400 M500,0 V400 M550,0 V400" />
  </g>

  <!-- Ambient Glows -->
  <circle cx="150" cy="120" r="100" fill="#0284c7" opacity="0.25" filter="url(#p1Glow)" />
  <circle cx="460" cy="280" r="120" fill="#f59e0b" opacity="0.2" filter="url(#p1Glow)" />

  <!-- Brand Identity Mockup Showcase -->
  <!-- Business Card Back -->
  <g transform="translate(100, 110) rotate(-8)">
    <rect width="220" height="130" rx="14" fill="#1e293b" stroke="url(#p1Blue)" stroke-width="2" />
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#p1Gold)" />
    <text x="32" y="44" font-family="sans-serif" font-weight="900" font-size="20" fill="#0f172a">N</text>
    <text x="70" y="38" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">NOVA BRAND</text>
    <text x="70" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8">Creative Studio</text>
    <line x1="20" y1="80" x2="160" y2="80" stroke="#334155" stroke-width="2" />
    <line x1="20" y1="95" x2="120" y2="95" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Business Card Front Floating -->
  <g transform="translate(240, 150) rotate(6)">
    <rect width="240" height="145" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#p1Gold)" stroke-width="2.5" />
    <circle cx="120" cy="60" r="28" fill="none" stroke="url(#p1Blue)" stroke-width="4" />
    <polygon points="120,40 135,70 105,70" fill="url(#p1Gold)" />
    <text x="120" y="110" font-family="sans-serif" font-weight="800" font-size="15" fill="#f8fafc" text-anchor="middle" letter-spacing="3">BRAND IDENTITY</text>
    <text x="120" y="126" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Visual Design System</text>
  </g>

  <!-- Color Palette Swatches -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#38bdf8" />
    <rect x="50" y="0" width="40" height="40" rx="8" fill="#0284c7" />
    <rect x="100" y="0" width="40" height="40" rx="8" fill="#fbbf24" />
    <rect x="150" y="0" width="40" height="40" rx="8" fill="#f59e0b" />
    <rect x="200" y="0" width="40" height="40" rx="8" fill="#0f172a" stroke="#475569" />
  </g>

  <!-- Badge Tag -->
  <g transform="translate(430, 60)">
    <rect width="130" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="65" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">Graphic Design</text>
  </g>
</svg>
