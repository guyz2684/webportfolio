<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p5Accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="p5Glow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p5Bg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="130" fill="#0284c7" opacity="0.2" filter="url(#p5Glow)" />
  <circle cx="420" cy="220" r="110" fill="#f59e0b" opacity="0.2" filter="url(#p5Glow)" />

  <!-- Smartphone Mockup 1 (Back/Angled) -->
  <g transform="translate(130, 60) rotate(-6)">
    <rect width="180" height="300" rx="30" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Screen -->
    <rect x="8" y="8" width="164" height="284" rx="24" fill="#030712" />
    <!-- Dynamic Island / Notch -->
    <rect x="62" y="16" width="56" height="12" rx="6" fill="#1e293b" />
    <!-- UI Card -->
    <rect x="20" y="45" width="140" height="60" rx="14" fill="#1e293b" />
    <circle cx="45" cy="75" r="14" fill="#0284c7" />
    <rect x="70" y="65" width="75" height="8" rx="4" fill="#64748b" />
    <rect x="70" y="80" width="45" height="6" rx="3" fill="#475569" />
    <!-- Chart Widget -->
    <rect x="20" y="120" width="140" height="80" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1" />
    <path d="M 35 175 L 65 155 L 95 165 L 125 140 L 145 145" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Action buttons -->
    <rect x="20" y="215" width="65" height="35" rx="10" fill="#fbbf24" />
    <rect x="95" y="215" width="65" height="35" rx="10" fill="#334155" />
  </g>

  <!-- Smartphone Mockup 2 (Front Focus) -->
  <g transform="translate(280, 50) rotate(5)">
    <rect width="185" height="310" rx="32" fill="#0284c7" opacity="0.2" filter="url(#p5Glow)" />
    <rect width="185" height="310" rx="32" fill="#0b1120" stroke="url(#p5Accent)" stroke-width="3" />
    <!-- Screen -->
    <rect x="8" y="8" width="169" height="294" rx="26" fill="#0f172a" />
    
    <!-- Top Bar -->
    <rect x="65" y="18" width="55" height="12" rx="6" fill="#1e293b" />
    <text x="25" y="55" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">Dashboard</text>
    <circle cx="155" cy="50" r="10" fill="#fbbf24" />

    <!-- Metric Card -->
    <rect x="20" y="70" width="145" height="75" rx="16" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="35" y="94" font-family="sans-serif" font-size="10" fill="#fbbf24">TOTAL ENGAGEMENT</text>
    <text x="35" y="125" font-family="sans-serif" font-weight="800" font-size="22" fill="#ffffff">98.4%</text>

    <!-- Bottom List items -->
    <rect x="20" y="160" width="145" height="42" rx="12" fill="#1e293b" />
    <circle cx="40" cy="181" r="12" fill="#38bdf8" />
    <rect x="62" y="174" width="70" height="7" rx="3" fill="#cbd5e1" />
    <rect x="62" y="186" width="40" height="5" rx="2" fill="#64748b" />

    <rect x="20" y="212" width="145" height="42" rx="12" fill="#1e293b" />
    <circle cx="40" cy="233" r="12" fill="#f59e0b" />
    <rect x="62" y="226" width="80" height="7" rx="3" fill="#cbd5e1" />
    <rect x="62" y="238" width="50" height="5" rx="2" fill="#64748b" />

    <!-- Bottom Nav -->
    <rect x="20" y="268" width="145" height="24" rx="12" fill="#030712" />
    <circle cx="45" cy="280" r="4" fill="#38bdf8" />
    <circle cx="92" cy="280" r="4" fill="#64748b" />
    <circle cx="140" cy="280" r="4" fill="#64748b" />
  </g>

  <!-- Floating UX Badge -->
  <g transform="translate(60, 40)">
    <rect width="110" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">UI/UX System</text>
  </g>
</svg>
