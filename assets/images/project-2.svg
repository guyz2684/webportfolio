<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="p2Glow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p2Bg)" />

  <!-- Ambient light -->
  <circle cx="300" cy="200" r="160" fill="#0284c7" opacity="0.2" filter="url(#p2Glow)" />
  <circle cx="480" cy="120" r="100" fill="#f59e0b" opacity="0.2" filter="url(#p2Glow)" />

  <!-- Camera Viewfinder Frame & UI -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.7">
    <!-- Corners -->
    <path d="M 60 70 L 60 50 L 80 50" fill="none" stroke-width="3" />
    <path d="M 520 50 L 540 50 L 540 70" fill="none" stroke-width="3" />
    <path d="M 60 330 L 60 350 L 80 350" fill="none" stroke-width="3" />
    <path d="M 520 350 L 540 350 L 540 330" fill="none" stroke-width="3" />
    
    <!-- Focus Box Center -->
    <rect x="230" y="130" width="140" height="140" rx="12" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6" />
    <line x1="300" y1="120" x2="300" y2="140" stroke="#fbbf24" stroke-width="2" />
    <line x1="300" y1="260" x2="300" y2="280" stroke="#fbbf24" stroke-width="2" />
    <line x1="220" y1="200" x2="240" y2="200" stroke="#fbbf24" stroke-width="2" />
    <line x1="360" y1="200" x2="380" y2="200" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Large Camera Lens / Aperture Illustration -->
  <circle cx="300" cy="200" r="95" fill="#090d16" stroke="url(#lensGrad)" stroke-width="6" />
  <circle cx="300" cy="200" r="82" fill="none" stroke="#1e293b" stroke-width="8" />
  <circle cx="300" cy="200" r="68" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
  <circle cx="300" cy="200" r="45" fill="#030712" />
  
  <!-- Lens Flare Reflection -->
  <ellipse cx="280" cy="180" rx="28" ry="14" fill="#38bdf8" opacity="0.35" transform="rotate(-30 280 180)" />
  <ellipse cx="320" cy="225" rx="16" ry="8" fill="#fbbf24" opacity="0.4" transform="rotate(-30 320 225)" />

  <!-- Camera HUD Data -->
  <text x="80" y="80" font-family="monospace" font-size="13" fill="#38bdf8" letter-spacing="1">ISO 400 | f/1.8 | 1/250s</text>
  <text x="450" y="80" font-family="monospace" font-size="13" fill="#fbbf24" letter-spacing="1">RAW [4K 60P]</text>
  
  <text x="80" y="340" font-family="monospace" font-size="12" fill="#94a3b8">AF-C [TRACKING ON]</text>
  <circle cx="530" cy="336" r="6" fill="#ef4444" />
  <text x="490" y="340" font-family="monospace" font-size="12" fill="#ef4444" font-weight="700">REC</text>

  <!-- Badge Tag -->
  <g transform="translate(235, 340)">
    <rect width="130" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="65" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Photography</text>
  </g>
</svg>
