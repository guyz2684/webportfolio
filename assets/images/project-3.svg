<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="trackBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="trackGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="p3Glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p3Bg)" />

  <!-- Video Player Preview Window -->
  <g transform="translate(60, 40)">
    <rect width="480" height="190" rx="14" fill="#030712" stroke="#334155" stroke-width="2" />
    
    <!-- Video Content Simulation -->
    <rect x="10" y="10" width="460" height="170" rx="10" fill="#0f172a" />
    <circle cx="240" cy="95" r="70" fill="#0284c7" opacity="0.3" filter="url(#p3Glow)" />
    <circle cx="300" cy="85" r="50" fill="#f59e0b" opacity="0.3" filter="url(#p3Glow)" />
    
    <!-- Audio Waveform in video -->
    <path d="M 30 140 Q 60 110, 90 140 T 150 140 T 210 140 T 270 140 T 330 140 T 390 140 T 450 140" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />
    
    <!-- Play Button Icon Center -->
    <circle cx="240" cy="95" r="32" fill="rgba(15, 23, 42, 0.75)" stroke="#fbbf24" stroke-width="2.5" />
    <polygon points="233,83 255,95 233,107" fill="#fbbf24" />

    <!-- Timecode Overlay -->
    <rect x="25" y="25" width="95" height="24" rx="6" fill="rgba(0,0,0,0.6)" />
    <text x="35" y="41" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="700">00:04:28:12</text>
  </g>

  <!-- NLE Video Editing Timeline -->
  <g transform="translate(60, 245)">
    <rect width="480" height="115" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Timeline Ruler -->
    <line x1="20" y1="20" x2="460" y2="20" stroke="#334155" stroke-width="1" />
    <path d="M 40 15 V 20 M 80 15 V 20 M 120 12 V 20 M 160 15 V 20 M 200 15 V 20 M 240 12 V 20 M 280 15 V 20 M 320 15 V 20 M 360 12 V 20 M 400 15 V 20 M 440 15 V 20" stroke="#64748b" stroke-width="1.5" />

    <!-- Video Track 1 -->
    <rect x="40" y="32" width="130" height="24" rx="5" fill="url(#trackBlue)" opacity="0.9" />
    <text x="50" y="48" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">A-ROLL_SCENE_01</text>
    <rect x="180" y="32" width="160" height="24" rx="5" fill="url(#trackBlue)" opacity="0.9" />
    <text x="190" y="48" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">A-ROLL_SCENE_02</text>
    <rect x="350" y="32" width="90" height="24" rx="5" fill="url(#trackBlue)" opacity="0.9" />

    <!-- Video Track 2 (Overlay / B-roll / Color Grade) -->
    <rect x="110" y="62" width="120" height="20" rx="5" fill="url(#trackGold)" />
    <text x="120" y="76" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">COLOR_LUT_CINEMA</text>
    <rect x="250" y="62" width="150" height="20" rx="5" fill="url(#trackGold)" />

    <!-- Audio Track -->
    <rect x="40" y="88" width="400" height="16" rx="4" fill="#047857" opacity="0.8" />
    <text x="50" y="100" font-family="sans-serif" font-size="9" font-weight="600" fill="#a7f3d0">SOUNDTRACK_BGM_MASTER.WAV</text>

    <!-- Playhead Red Needle -->
    <line x1="210" y1="5" x2="210" y2="110" stroke="#f43f5e" stroke-width="2" />
    <polygon points="204,5 216,5 210,14" fill="#f43f5e" />
  </g>
</svg>
